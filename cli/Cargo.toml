[package]
name = "cols-cli"
version = "0.1.0"
edition = "2021"
description = "Command line interface for the COLS on-chain protocol"
license = "MIT"
repository = "https://github.com/Colszoo/cols-protocol"
authors = ["Colszoo <289228263+Colszoo@users.noreply.github.com>"]

[[bin]]
name = "cols"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
solana-client = "=1.18.26"
solana-sdk = "=1.18.26"
solana-program = "=4.0.0"
borsh = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.39", features = ["full"] }
anyhow = "1.0"
base64 = "0.22"
bs58 = "0.5"
anchor-lang = "0.30.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
